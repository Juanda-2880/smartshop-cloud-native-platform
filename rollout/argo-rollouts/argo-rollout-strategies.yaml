# ============================================================================
# SmartShop Progressive Delivery Catalog:
# 1. Argo Rollouts Blue-Green Specification
# 2. Argo Rollouts Canary Specification
# 3. RollingUpdate & Recreate Specifications
# 4. Shadow (Dark Launch Traffic Mirroring) Ingress
# 5. Runtime Feature Flags ConfigMap
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: smartshop-feature-flags
  namespace: smartshop-rollouts
  labels:
    app.kubernetes.io/part-of: smartshop-platform
    strategy: feature-flags
data:
  flags.json: |
    {
      "aiRecommendationsEnabled": true,
      "instantOneClickCheckout": true,
      "shadowMirroringPercentage": 100,
      "canaryWeightPercent": 20,
      "activeSlot": "blue"
    }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartshop-shadow-ingress
  namespace: smartshop-rollouts
  labels:
    strategy: shadow
  annotations:
    nginx.ingress.kubernetes.io/mirror-target: "http://smartshop-green-service.smartshop-rollouts.svc.cluster.local"
    nginx.ingress.kubernetes.io/mirror-request-body: "on"
spec:
  ingressClassName: nginx
  rules:
    - host: shadow.smartshop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smartshop-active-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartshop-canary-ingress
  namespace: smartshop-rollouts
  labels:
    strategy: canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
spec:
  ingressClassName: nginx
  rules:
    - host: rollout.smartshop.local
      http:
        paths:
          - path: /canary
            pathType: Prefix
            backend:
              service:
                name: smartshop-green-service
                port:
                  number: 80

