apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartshop-prometheus
  namespace: smartshop-observability
  labels:
    app: smartshop-prometheus
    app.kubernetes.io/part-of: smartshop-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartshop-prometheus
  template:
    metadata:
      labels:
        app: smartshop-prometheus
    spec:
      serviceAccountName: smartshop-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: smartshop-prometheus
  namespace: smartshop-observability
  labels:
    app: smartshop-prometheus
    app.kubernetes.io/part-of: smartshop-platform
spec:
  type: ClusterIP
  selector:
    app: smartshop-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: smartshop-node-exporter
  namespace: smartshop-observability
  labels:
    app: smartshop-node-exporter
    app.kubernetes.io/part-of: smartshop-platform
spec:
  selector:
    matchLabels:
      app: smartshop-node-exporter
  template:
    metadata:
      labels:
        app: smartshop-node-exporter
    spec:
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9100
              name: metrics
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "150m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: smartshop-node-exporter
  namespace: smartshop-observability
  labels:
    app: smartshop-node-exporter
spec:
  type: ClusterIP
  selector:
    app: smartshop-node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartshop-kube-state-metrics
  namespace: smartshop-observability
  labels:
    app: smartshop-kube-state-metrics
    app.kubernetes.io/part-of: smartshop-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartshop-kube-state-metrics
  template:
    metadata:
      labels:
        app: smartshop-kube-state-metrics
    spec:
      serviceAccountName: smartshop-prometheus
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.15.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http-metrics
            - containerPort: 8081
              name: telemetry
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: smartshop-kube-state-metrics
  namespace: smartshop-observability
  labels:
    app: smartshop-kube-state-metrics
spec:
  type: ClusterIP
  selector:
    app: smartshop-kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 8080

