apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartshop-prometheus
  namespace: smartshop-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: smartshop-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: smartshop-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: smartshop-prometheus
subjects:
  - kind: ServiceAccount
    name: smartshop-prometheus
    namespace: smartshop-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: smartshop-observability
  labels:
    app: smartshop-prometheus
    app.kubernetes.io/part-of: smartshop-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
      external_labels:
        cluster: 'smartshop-minikube'
        environment: 'production'

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - 'smartshop-alertmanager.smartshop-observability.svc.cluster.local:9093'

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['127.0.0.1:9090']

      - job_name: 'smartshop-backend'
        metrics_path: '/actuator/prometheus'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['smartshop']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: smartshop-backend
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8080
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['smartshop-node-exporter.smartshop-observability.svc.cluster.local:9100']

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['smartshop-kube-state-metrics.smartshop-observability.svc.cluster.local:8080']

      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      - job_name: 'kubernetes-cadvisor'
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  alert_rules.yml: |
    groups:
      - name: smartshop_use_infrastructure_alerts
        rules:
          - alert: HighNodeCpuUtilization
            expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m]))) * 100 > 85
            for: 2m
            labels:
              severity: warning
              model: USE
              category: infrastructure
            annotations:
              summary: "High Node CPU Utilization (> 85%)"
              description: "USE Utilization threshold exceeded on Minikube node."

          - alert: HighNodeMemorySaturation
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
            for: 2m
            labels:
              severity: warning
              model: USE
              category: infrastructure
            annotations:
              summary: "High Node Memory Utilization & Saturation (> 85%)"
              description: "Available node RAM is below 15%."

          - alert: HighDiskUtilization
            expr: (1 - (disk_free_bytes / disk_total_bytes)) * 100 > 90
            for: 5m
            labels:
              severity: critical
              model: USE
              category: infrastructure
            annotations:
              summary: "Disk Utilization > 90%"
              description: "Storage volume is nearing capacity."

      - name: smartshop_red_application_alerts
        rules:
          - alert: HighApplicationErrorRate
            expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[2m])) / clamp_min(sum(rate(http_server_requests_seconds_count[2m])), 0.001)) * 100 > 5
            for: 1m
            labels:
              severity: critical
              model: RED
              category: application
            annotations:
              summary: "RED Error Rate > 5% on SmartShop Backend"
              description: "HTTP 5xx error ratio exceeded 5% over 2 minutes."

          - alert: HighApplicationLatencyP95
            expr: (sum(rate(http_server_requests_seconds_sum[2m])) / clamp_min(sum(rate(http_server_requests_seconds_count[2m])), 0.001)) > 0.5
            for: 2m
            labels:
              severity: warning
              model: RED
              category: application
            annotations:
              summary: "RED Duration Latency > 500ms"
              description: "Average HTTP request duration exceeded 500ms."

      - name: smartshop_kubernetes_and_business_alerts
        rules:
          - alert: KubernetesPodNotReady
            expr: kube_pod_status_ready{namespace="smartshop", condition="true"} == 0
            for: 2m
            labels:
              severity: critical
              category: kubernetes
            annotations:
              summary: "SmartShop Pod Not Ready in namespace smartshop"
              description: "A pod in namespace smartshop has been unready for more than 2 minutes."

          - alert: SmartShopObservabilityWatchdog
            expr: vector(1)
            labels:
              severity: info
              model: RED_USE
              category: observability
            annotations:
              summary: "SmartShop Observability Pipeline Heartbeat Active"
              description: "Continuous verification alert confirming Prometheus -> Alertmanager pipeline is active."

          - alert: LowEcommerceConversionRateNotice
            expr: smartshop_conversion_rate < 0.05
            for: 10s
            labels:
              severity: info
              category: business
            annotations:
              summary: "E-Commerce Conversion Rate Monitoring Active"
              description: "Tracks live conversion ratio between product visits and completed orders."

