apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smartshop-backend-hpa
  namespace: smartshop
  labels:
    app: smartshop-backend
    app.kubernetes.io/name: smartshop-backend-hpa
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: smartshop-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smartshop-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 15
      selectPolicy: Max
      policies:
        - type: Pods
          value: 4
          periodSeconds: 15
---
