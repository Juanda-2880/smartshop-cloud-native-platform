apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress-policy
  namespace: smartshop
  labels:
    app.kubernetes.io/part-of: smartshop-platform
    app.kubernetes.io/component: network-security
spec:
  podSelector:
    matchLabels:
      app: smartshop-frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: smartshop-backend
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress-policy
  namespace: smartshop
  labels:
    app.kubernetes.io/part-of: smartshop-platform
    app.kubernetes.io/component: network-security
spec:
  podSelector:
    matchLabels:
      app: smartshop-backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: smartshop-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: smartshop-observability
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: smartshop-logging
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authorized-client-egress-policy
  namespace: smartshop
  labels:
    app.kubernetes.io/part-of: smartshop-platform
    app.kubernetes.io/component: network-security
spec:
  podSelector:
    matchLabels:
      role: authorized-client
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: smartshop-backend
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: smartshop-frontend
      ports:
        - protocol: TCP
          port: 80

