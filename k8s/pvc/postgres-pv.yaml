apiVersion: v1
kind: PersistentVolume
metadata:
  name: smartshop-postgres-pv
  labels:
    app: smartshop-postgres
    app.kubernetes.io/name: smartshop-postgres-pv
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: smartshop-platform
    type: local
spec:
  storageClassName: standard
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/smartshop-postgres
    type: DirectoryOrCreate

