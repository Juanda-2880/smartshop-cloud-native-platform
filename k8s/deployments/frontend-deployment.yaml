apiVersion: v1
kind: ConfigMap
metadata:
  name: smartshop-frontend-nginx
  namespace: smartshop
  labels:
    app: smartshop-frontend
    app.kubernetes.io/part-of: smartshop-platform
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

        location = /healthz {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"UP","service":"smartshop-frontend"}';
        }

        location /api/ {
            proxy_pass http://smartshop-backend:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /actuator/ {
            proxy_pass http://smartshop-backend:8080/actuator/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartshop-frontend
  namespace: smartshop
  labels:
    app: smartshop-frontend
    app.kubernetes.io/name: smartshop-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: smartshop-platform
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartshop-frontend
  template:
    metadata:
      labels:
        app: smartshop-frontend
        app.kubernetes.io/name: smartshop-frontend
        app.kubernetes.io/component: frontend
        tier: frontend
        version: v1
    spec:
      containers:
        - name: frontend
          image: smartshop-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: smartshop-config
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: nginx-config
          configMap:
            name: smartshop-frontend-nginx

