apiVersion: v1
kind: Service
metadata:
  name: smartshop-backend
  namespace: smartshop
  labels:
    app: smartshop-backend
    app.kubernetes.io/name: smartshop-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: smartshop-platform
spec:
  type: ClusterIP
  selector:
    app: smartshop-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

