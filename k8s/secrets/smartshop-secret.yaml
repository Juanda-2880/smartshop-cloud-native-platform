apiVersion: v1
kind: Secret
metadata:
  name: smartshop-secret
  namespace: smartshop
  labels:
    app.kubernetes.io/part-of: smartshop-platform
    app.kubernetes.io/component: security
type: Opaque
stringData:
  POSTGRES_USER: "smartshop_user"
  POSTGRES_PASSWORD: "smartshop_password"
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin_password"
  JWT_SECRET_SALT: "smartshop-enterprise-cloud-native-rs256-salt-2026"

