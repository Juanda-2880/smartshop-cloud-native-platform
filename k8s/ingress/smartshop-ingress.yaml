apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartshop-ingress
  namespace: smartshop
  labels:
    app.kubernetes.io/name: smartshop-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: smartshop-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: smartshop.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: smartshop-backend
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: smartshop-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smartshop-frontend
                port:
                  number: 80
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: smartshop-backend
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: smartshop-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smartshop-frontend
                port:
                  number: 80

