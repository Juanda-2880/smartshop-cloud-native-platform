apiVersion: v1
kind: ConfigMap
metadata:
  name: smartshop-config
  namespace: smartshop
  labels:
    app.kubernetes.io/part-of: smartshop-platform
    app.kubernetes.io/component: configuration
data:
  SPRING_PROFILES_ACTIVE: "postgres"
  POSTGRES_HOST: "smartshop-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "smartshop"
  SERVER_PORT: "8080"
  KEYCLOAK_ISSUER_URI: "http://smartshop-keycloak.smartshop.svc.cluster.local:8080/realms/smartshop"
  VITE_API_BASE_URL: "http://smartshop.local/api/v1"

