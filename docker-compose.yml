services:
  postgres:
    image: postgres:17-alpine
    container_name: smartshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartshop
      POSTGRES_USER: smartshop_user
      POSTGRES_PASSWORD: smartshop_password
    ports:
      - "5432:5432"
    volumes:
      - smartshop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartshop_user -d smartshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smartshop-backend:1.0.0
    container_name: smartshop-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: smartshop
      POSTGRES_USER: smartshop_user
      POSTGRES_PASSWORD: smartshop_password
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: smartshop-frontend:1.0.0
    container_name: smartshop-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  smartshop_pgdata:
    name: smartshop_pgdata

