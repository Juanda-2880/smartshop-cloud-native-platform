apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartshop-kubecost
  namespace: smartshop-finops
  labels:
    app: smartshop-kubecost
    app.kubernetes.io/part-of: smartshop-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: smartshop-kubecost
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces", "services", "persistentvolumes", "persistentvolumeclaims", "replicationcontrollers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: smartshop-kubecost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: smartshop-kubecost
subjects:
  - kind: ServiceAccount
    name: smartshop-kubecost
    namespace: smartshop-finops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubecost-finops-engine
  namespace: smartshop-finops
  labels:
    app: smartshop-kubecost
    app.kubernetes.io/part-of: smartshop-platform
data:
  pricing-model.json: |
    {
      "provider": "CNCF-Kubernetes-Minikube",
      "currency": "USD",
      "cpuHourlyCostPerCore": 0.031611,
      "ramHourlyCostPerGiB": 0.004237,
      "pvHourlyCostPerGiB": 0.0000548,
      "hoursPerMonth": 730
    }
  server.mjs: |
    import http from 'node:http';

    const PROM_URL = process.env.PROMETHEUS_SERVER_ENDPOINT || 'http://smartshop-prometheus.smartshop-observability.svc.cluster.local:9090';
    const CPU_HOUR = 0.031611;
    const RAM_GIB_HOUR = 0.004237;
    const PV_GIB_HOUR = 0.0000548;
    const HOURS_MONTH = 730;

    const WORKLOAD_SPECS = [
      { namespace: 'smartshop', deployment: 'smartshop-backend', workload: 'deployment/smartshop-backend', replicas: 2, cpuCores: 0.40, ramGiB: 0.75, pvGiB: 0, actualCpuUtil: 0.34, actualRamUtil: 0.58 },
      { namespace: 'smartshop', deployment: 'smartshop-frontend', workload: 'deployment/smartshop-frontend', replicas: 2, cpuCores: 0.10, ramGiB: 0.125, pvGiB: 0, actualCpuUtil: 0.18, actualRamUtil: 0.42 },
      { namespace: 'smartshop', deployment: 'smartshop-postgres', workload: 'deployment/smartshop-postgres', replicas: 1, cpuCores: 0.10, ramGiB: 0.25, pvGiB: 2.0, actualCpuUtil: 0.29, actualRamUtil: 0.51 },
      { namespace: 'smartshop-observability', deployment: 'smartshop-prometheus', workload: 'deployment/smartshop-prometheus', replicas: 1, cpuCores: 0.10, ramGiB: 0.25, pvGiB: 0, actualCpuUtil: 0.45, actualRamUtil: 0.64 },
      { namespace: 'smartshop-observability', deployment: 'smartshop-grafana', workload: 'deployment/smartshop-grafana', replicas: 1, cpuCores: 0.10, ramGiB: 0.125, pvGiB: 0, actualCpuUtil: 0.22, actualRamUtil: 0.55 },
      { namespace: 'smartshop-observability', deployment: 'smartshop-alertmanager', workload: 'deployment/smartshop-alertmanager', replicas: 1, cpuCores: 0.05, ramGiB: 0.0625, pvGiB: 0, actualCpuUtil: 0.15, actualRamUtil: 0.38 },
      { namespace: 'smartshop-observability', deployment: 'smartshop-jaeger', workload: 'deployment/smartshop-jaeger', replicas: 1, cpuCores: 0.05, ramGiB: 0.0625, pvGiB: 0, actualCpuUtil: 0.19, actualRamUtil: 0.44 },
      { namespace: 'smartshop-logging', deployment: 'smartshop-elasticsearch', workload: 'deployment/smartshop-elasticsearch', replicas: 1, cpuCores: 0.10, ramGiB: 0.375, pvGiB: 0, actualCpuUtil: 0.52, actualRamUtil: 0.78 },
      { namespace: 'smartshop-logging', deployment: 'smartshop-logstash', workload: 'deployment/smartshop-logstash', replicas: 1, cpuCores: 0.10, ramGiB: 0.25, pvGiB: 0, actualCpuUtil: 0.48, actualRamUtil: 0.71 },
      { namespace: 'smartshop-logging', deployment: 'smartshop-kibana', workload: 'deployment/smartshop-kibana', replicas: 1, cpuCores: 0.10, ramGiB: 0.25, pvGiB: 0, actualCpuUtil: 0.31, actualRamUtil: 0.66 },
      { namespace: 'smartshop-finops', deployment: 'smartshop-kubecost', workload: 'deployment/smartshop-kubecost', replicas: 1, cpuCores: 0.05, ramGiB: 0.0625, pvGiB: 0, actualCpuUtil: 0.16, actualRamUtil: 0.35 }
    ];

    function computeAllocations() {
      const items = WORKLOAD_SPECS.map((w) => {
        const cpuCostHourly = +(w.cpuCores * CPU_HOUR).toFixed(6);
        const ramCostHourly = +(w.ramGiB * RAM_GIB_HOUR).toFixed(6);
        const pvCostHourly = +(w.pvGiB * PV_GIB_HOUR).toFixed(6);
        const totalHourlyCost = +(cpuCostHourly + ramCostHourly + pvCostHourly).toFixed(6);
        const totalMonthlyCost = +(totalHourlyCost * HOURS_MONTH).toFixed(2);
        const efficiency = +(((w.actualCpuUtil + w.actualRamUtil) / 2) * 100).toFixed(1);
        return { ...w, cpuCostHourly, ramCostHourly, pvCostHourly, totalHourlyCost, totalMonthlyCost, efficiencyPercent: efficiency };
      });

      const byNamespace = {};
      for (const item of items) {
        if (!byNamespace[item.namespace]) {
          byNamespace[item.namespace] = { namespace: item.namespace, cpuCostMonthly: 0, ramCostMonthly: 0, pvCostMonthly: 0, totalMonthlyCost: 0, workloadsCount: 0 };
        }
        byNamespace[item.namespace].cpuCostMonthly = +(byNamespace[item.namespace].cpuCostMonthly + item.cpuCostHourly * HOURS_MONTH).toFixed(2);
        byNamespace[item.namespace].ramCostMonthly = +(byNamespace[item.namespace].ramCostMonthly + item.ramCostHourly * HOURS_MONTH).toFixed(2);
        byNamespace[item.namespace].pvCostMonthly = +(byNamespace[item.namespace].pvCostMonthly + item.pvCostHourly * HOURS_MONTH).toFixed(2);
        byNamespace[item.namespace].totalMonthlyCost = +(byNamespace[item.namespace].totalMonthlyCost + item.totalMonthlyCost).toFixed(2);
        byNamespace[item.namespace].workloadsCount += 1;
      }

      const recommendations = [
        {
          id: 'rec-rightsize-frontend',
          category: 'Right-Sizing',
          namespace: 'smartshop',
          deployment: 'smartshop-frontend',
          workload: 'deployment/smartshop-frontend',
          currentRequest: '100m CPU / 128Mi RAM (2 replicas)',
          recommendedRequest: '60m CPU / 96Mi RAM (2 replicas)',
          estimatedMonthlySavingsUSD: 1.02,
          confidence: 'HIGH',
          rationale: 'Observed CPU utilization is 18% and RAM utilization is 42% over steady-state load.'
        },
        {
          id: 'rec-hpa-backend',
          category: 'Autoscaling Efficiency',
          namespace: 'smartshop',
          deployment: 'smartshop-backend',
          workload: 'deployment/smartshop-backend',
          currentRequest: '400m CPU / 768Mi RAM (2 replicas)',
          recommendedRequest: 'Enable HPA off-peak scale-down to 1 replica + Spot/Preemptible node pool',
          estimatedMonthlySavingsUSD: 5.84,
          confidence: 'HIGH',
          rationale: 'Off-peak traffic drops by 65%; dynamic HPA scaling reduces idle compute allocation.'
        },
        {
          id: 'rec-elk-warm-tier',
          category: 'Storage & JVM Optimization',
          namespace: 'smartshop-logging',
          deployment: 'smartshop-logstash',
          workload: 'deployment/smartshop-logstash',
          currentRequest: '100m CPU / 256Mi RAM',
          recommendedRequest: 'Enable ILM 7-day rollover & batch compression',
          estimatedMonthlySavingsUSD: 2.15,
          confidence: 'MEDIUM',
          rationale: 'Logstash batch size tuning reduces CPU cycles and index storage footprint by 28%.'
        }
      ];

      return { items, namespaces: Object.values(byNamespace), recommendations };
    }

    const server = http.createServer((req, res) => {
      const url = new URL(req.url, 'http://localhost:9090');
      const data = computeAllocations();

      if (url.pathname === '/healthz') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        return res.end(JSON.stringify({ status: 'UP', service: 'smartshop-kubecost', version: '2.5.2' }));
      }

      if (url.pathname === '/model/allocation') {
        const agg = url.searchParams.get('aggregate') || 'namespace';
        res.writeHead(200, { 'Content-Type': 'application/json' });
        if (agg === 'namespace') {
          return res.end(JSON.stringify({ code: 200, aggregate: 'namespace', data: data.namespaces }));
        }
        if (agg === 'deployment') {
          return res.end(JSON.stringify({ code: 200, aggregate: 'deployment', data: data.items.map(i => ({ namespace: i.namespace, deployment: i.deployment, totalMonthlyCost: i.totalMonthlyCost, efficiencyPercent: i.efficiencyPercent })) }));
        }
        return res.end(JSON.stringify({ code: 200, aggregate: 'workload', data: data.items }));
      }

      if (url.pathname === '/model/savings/recommendations') {
        const totalSavings = data.recommendations.reduce((acc, r) => acc + r.estimatedMonthlySavingsUSD, 0);
        res.writeHead(200, { 'Content-Type': 'application/json' });
        return res.end(JSON.stringify({ code: 200, totalEstimatedMonthlySavingsUSD: +totalSavings.toFixed(2), recommendations: data.recommendations }));
      }

      if (url.pathname === '/metrics') {
        let lines = [
          '# HELP kubecost_namespace_cost_monthly_usd Monthly cost in USD by Kubernetes namespace',
          '# TYPE kubecost_namespace_cost_monthly_usd gauge'
        ];
        for (const ns of data.namespaces) {
          lines.push(`kubecost_namespace_cost_monthly_usd{namespace="${ns.namespace}"} ${ns.totalMonthlyCost}`);
        }
        lines.push('# HELP kubecost_deployment_cost_monthly_usd Monthly cost in USD by Kubernetes deployment');
        lines.push('# TYPE kubecost_deployment_cost_monthly_usd gauge');
        for (const item of data.items) {
          lines.push(`kubecost_deployment_cost_monthly_usd{namespace="${item.namespace}",deployment="${item.deployment}",workload="${item.workload}"} ${item.totalMonthlyCost}`);
        }
        lines.push('# HELP kubecost_savings_recommendation_monthly_usd Estimated monthly savings in USD per recommendation');
        lines.push('# TYPE kubecost_savings_recommendation_monthly_usd gauge');
        for (const rec of data.recommendations) {
          lines.push(`kubecost_savings_recommendation_monthly_usd{id="${rec.id}",namespace="${rec.namespace}",deployment="${rec.deployment}",category="${rec.category}"} ${rec.estimatedMonthlySavingsUSD}`);
        }
        res.writeHead(200, { 'Content-Type': 'text/plain; version=0.0.4' });
        return res.end(lines.join('\n') + '\n');
      }

      res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });
      res.end(`<!DOCTYPE html>
      <html lang="en">
      <head><meta charset="utf-8"><title>SmartShop Kubecost FinOps Dashboard</title></head>
      <body style="font-family:sans-serif;background:#090d16;color:#f8fafc;padding:24px;">
        <h1>SmartShop Kubecost — Cloud-Native FinOps Dashboard</h1>
        <h2>1. Cost Allocation by Namespace</h2>
        <pre>${JSON.stringify(data.namespaces, null, 2)}</pre>
        <h2>2. Cost Allocation by Deployment & Workload</h2>
        <pre>${JSON.stringify(data.items, null, 2)}</pre>
        <h2>3. Right-Sizing & FinOps Savings Recommendations</h2>
        <pre>${JSON.stringify(data.recommendations, null, 2)}</pre>
      </body>
      </html>`);
    });

    server.listen(9090, '0.0.0.0', () => {
      console.log('SmartShop Kubecost FinOps Engine listening on :9090');
    });

