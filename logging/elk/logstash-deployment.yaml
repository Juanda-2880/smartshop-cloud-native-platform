apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: smartshop-logging
  labels:
    app: smartshop-logstash
    app.kubernetes.io/part-of: smartshop-platform
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    path.config: /usr/share/logstash/pipeline
    pipeline.workers: 1
    pipeline.batch.size: 50
  logstash.conf: |
    input {
      file {
        path => "/var/log/pods/*/*/*.log"
        start_position => "beginning"
        sincedb_path => "/dev/null"
        tags => ["kubernetes_pod_log"]
      }
      http {
        host => "0.0.0.0"
        port => 8080
        codec => "json"
        tags => ["smartshop_structured_event"]
      }
    }

    filter {
      if "kubernetes_pod_log" in [tags] {
        grok {
          match => { "path" => "/var/log/pods/%{DATA:k8s_namespace}_%{DATA:k8s_pod_name}_%{DATA:k8s_pod_uid}/%{DATA:k8s_container_name}/.*" }
          tag_on_failure => []
        }

        if [k8s_container_name] == "backend" or [k8s_pod_name] =~ /^smartshop-backend/ {
          mutate {
            add_field => {
              "log_source" => "backend"
              "service" => "smartshop-backend"
            }
          }
        } else if [k8s_container_name] == "frontend" or [k8s_pod_name] =~ /^smartshop-frontend/ {
          mutate {
            add_field => {
              "log_source" => "frontend"
              "service" => "smartshop-frontend"
            }
          }
        } else {
          mutate {
            add_field => {
              "log_source" => "kubernetes"
              "service" => "kubernetes-cluster"
            }
          }
        }

        if [message] =~ /(?i)(error|exception|fail|denied|drop|warn)/ {
          mutate { add_field => { "dashboard_category" => "errors" } }
        } else if [message] =~ /(?i)(auth|oidc|jwt|rbac|keycloak|networkpolicy|security)/ {
          mutate { add_field => { "dashboard_category" => "security" } }
        } else if [message] =~ /(?i)(order|cart|product|checkout|conversion|category)/ {
          mutate { add_field => { "dashboard_category" => "business" } }
        } else {
          mutate { add_field => { "dashboard_category" => "operations" } }
        }
      }
      if ![log_source] {
        mutate { add_field => { "log_source" => "application" } }
      }
    }

    output {
      elasticsearch {
        hosts => ["http://smartshop-elasticsearch.smartshop-logging.svc.cluster.local:9200"]
        index => "smartshop-logs-%{[log_source]}-%{+YYYY.MM.dd}"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartshop-logstash
  namespace: smartshop-logging
  labels:
    app: smartshop-logstash
    app.kubernetes.io/name: smartshop-logstash
    app.kubernetes.io/component: logstash
    app.kubernetes.io/part-of: smartshop-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartshop-logstash
  template:
    metadata:
      labels:
        app: smartshop-logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:7.17.27
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms256m -Xmx256m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
          ports:
            - containerPort: 8080
              name: http-input
            - containerPort: 9600
              name: metrics
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: config-volume
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: logstash-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
---
apiVersion: v1
kind: Service
metadata:
  name: smartshop-logstash
  namespace: smartshop-logging
  labels:
    app: smartshop-logstash
    app.kubernetes.io/part-of: smartshop-platform
spec:
  type: ClusterIP
  selector:
    app: smartshop-logstash
  ports:
    - name: http-input
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9600
      targetPort: 9600
