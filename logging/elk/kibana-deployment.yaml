apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: smartshop-logging
  labels:
    app: smartshop-kibana
    app.kubernetes.io/part-of: smartshop-platform
data:
  kibana.yml: |
    server.name: smartshop-kibana
    server.host: "0.0.0.0"
    elasticsearch.hosts: ["http://smartshop-elasticsearch.smartshop-logging.svc.cluster.local:9200"]
    monitoring.ui.container.elasticsearch.enabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartshop-kibana
  namespace: smartshop-logging
  labels:
    app: smartshop-kibana
    app.kubernetes.io/name: smartshop-kibana
    app.kubernetes.io/component: kibana
    app.kubernetes.io/part-of: smartshop-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartshop-kibana
  template:
    metadata:
      labels:
        app: smartshop-kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:7.17.27
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=256"
          ports:
            - containerPort: 5601
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /usr/share/kibana/config/kibana.yml
              subPath: kibana.yml
      volumes:
        - name: config
          configMap:
            name: kibana-config
---
apiVersion: v1
kind: Service
metadata:
  name: smartshop-kibana
  namespace: smartshop-logging
  labels:
    app: smartshop-kibana
    app.kubernetes.io/part-of: smartshop-platform
spec:
  type: ClusterIP
  selector:
    app: smartshop-kibana
  ports:
    - name: http
      port: 5601
      targetPort: 5601

